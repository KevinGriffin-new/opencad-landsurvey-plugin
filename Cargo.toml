[package]
name = "opencad-landsurvey-plugin"
version = "0.4.23"
edition = "2021"
description = "Land Survey add-on for Open CAD Studio — survey points, PNEZD import, recognized-plan import, and COGO geometry."
license = "GPL-3.0-only"

# A plugin is a C-ABI dynamic library the host loads at runtime.
[lib]
crate-type = ["cdylib"]

[dependencies]
# The stable contract, with the runtime `host` surface (HostApi / BuiltinPlugin).
# Pinned to the v2026.41 RELEASE TAG commit (the MSI host) so contract types match.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "cff240ef71b4d7d0e4832c8d260c5af7f2fe3b17", features = ["host"] }

# This plugin constructs entities (Point / Line / Arc / Circle / Text) and XDATA
# records, so it names the host's CAD codec types directly. It must resolve to
# the *same* build of the codec as the host, or the types crossing the plugin
# boundary are not the same types (approach B: same toolchain + dependency
# versions).
#
# Match the v2026.41 release's codec EXACTLY — same URL, same rev — read out of
# THAT tag's Cargo.lock, never from whatever `main` happens to be. The crate has
# moved and been renamed: HakanSeven12/acadrust -> OpenAEC-Foundation/acadifc
# (host v0.8.7) -> HakanSeven12/cadcodec (host v0.9.5), all as the `acadrust`
# package, then -> HakanSeven12/opencadcodec as the `opencadcodec` package
# (host v2026.39), which ocs_plugin_api imports under the key `codec`. We use
# the same key so code reads `codec::…` on both sides of the boundary.
#
# This was a crates.io requirement redirected by [patch.crates-io] until host
# v0.9.5, when ocs_plugin_api itself began depending on the codec by git. A
# crates.io patch does not reach a git-sourced dependency, so that arrangement
# would have resolved two different codecs into one graph.
#
# The rev below is copied VERBATIM from ocs_plugin_api's own manifest, including
# its abbreviation. Cargo keys a git source on the literal `?rev=` text, so
# `rev = "931c4ab"` and `rev = "931c4ab0c590...b139f"` are two sources for one
# commit, and writing the expanded form here really does lock two codecs.
# `gate-source` in the re-pin workflow compares the spelling; `gate-abi` then
# checks the lockfile resolved exactly one.
codec = { package = "opencadcodec", git = "https://github.com/HakanSeven12/opencadcodec.git", rev = "8189f83", features = ["serde"] }

# Layer-C engine — host-free COGO / PNEZD / plan parsing (std + serde only).
landsurvey = { path = "crates/landsurvey" }

[workspace]
members = ["crates/landsurvey", "crates/landsurvey-cli"]

# The host root sometimes redirects acadrust through a [patch] table — host
# v0.9.8 added one pointing the same repository's `https://git@github.com/...`
# spelling at a different rev. Cargo counts that userinfo as part of a source's
# identity (which is what makes the redirect legal at all), and a [patch] only
# applies from the workspace root. This crate is its own root, so without a
# mirror of the host's redirect we resolve the source upstream patched *away
# from*: every spelling gate passes and the lockfile still lands on a different
# commit than the host runs.
#
# The block between the markers is regenerated by the re-pin from the host's own
# manifest — including emptying it when upstream drops the patch. Change
# .github/scripts/repin_gates.py, not these lines.
# --- BEGIN mirrored acadrust patch ---
# (the host declares no acadrust [patch] at this release)
# --- END mirrored acadrust patch ---
