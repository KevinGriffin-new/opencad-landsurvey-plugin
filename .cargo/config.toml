# HakanSeven12/acadrust was deleted on 2026-11-04; its history now lives at
# hakanaktt/acadrust (upstream OpenCADStudio 03e4c1324). opencaddocument d657f94,
# which host v2026.44 pins, still names the old URL, so a clean checkout cannot
# fetch it ("failed to authenticate", i.e. the repository is gone).
#
# Source replacement only changes where Cargo downloads from: Cargo.toml and
# Cargo.lock keep the original source, the commit is the same, and the repin
# gates see the exact host dependency graph. Delete this file once the plugin
# pins a host whose opencaddocument names hakanaktt/acadrust itself.
[source.acadrust-deleted]
git = "https://github.com/HakanSeven12/acadrust.git"
rev = "53e6420"
replace-with = "acadrust-moved"

[source.acadrust-moved]
git = "https://github.com/hakanaktt/acadrust.git"
rev = "53e6420"
