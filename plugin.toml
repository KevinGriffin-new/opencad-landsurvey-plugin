[plugin]
id = "opencad.landsurvey"
name = "Land Survey"
version = "0.4.17"
description = "Survey points, PNEZD & LandXML import, TIN surfaces, earthwork volumes, COGO, and coordinate transforms (RTS / Helmert / resection)."
author = "Kevin Griffin"
license = "GPL-3.0-only"

[opencad]
# Must match API_VERSION exported by the linked ocs_plugin_api.
# Studio 2026.36 uses API 5; generated build metadata is added during packaging.
api_version = 5
ribbon_order = 50
command_prefixes = ["LS_"]
xdata_apps = ["LANDSURVEY_POINT", "LANDSURVEY_PLAN", "LANDSURVEY_SURFACE"]
