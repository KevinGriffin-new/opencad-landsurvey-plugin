name: release

# Build the plugin cdylib for each desktop platform and attach the binaries
# (plus plugin.toml) to a GitHub Release. Open CAD Studio's Plugin Manager reads
# the release assets, picks the one matching the user's OS/arch, and installs it.
#
# Two entry points:
#
#   push (v* tag)  — a human tagged by hand.
#   workflow_call  — repin.yml cutting an automated release. This exists because
#                    GitHub does not start workflows from events created with
#                    the default GITHUB_TOKEN: a tag the bot pushes would never
#                    fire the `push` trigger above, so the bot calls this
#                    workflow directly instead of relying on the tag event.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.4.6). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.landsurvey-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.landsurvey-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.landsurvey-macos-aarch64.dylib
    runs-on: ${{ matrix.os }}
    env:
      # `inputs` is unset on the push path, so this resolves to the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the tagged commit, not whatever the default branch points at
          # by the time a called run starts.
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the verified host compiler
        shell: bash
        run: |
          # `rustup show` only reports since rustup 1.28; it no longer installs the
          # toolchain named in rust-toolchain.toml. Install it explicitly so the
          # step does what its name says, whatever rustup version the runner has.
          rustup toolchain install "$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" --profile minimal
      - name: Verify host pin and compiler
        run: python .github/scripts/build_metadata.py

      # A release whose tag disagrees with the manifests ships a plugin that
      # reports the wrong version to the Plugin Manager. Catch it before the
      # assets are built.
      - name: Check tag matches the declared plugin version
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin_ver=$(grep -m1 '^version = ' plugin.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$cargo_ver  plugin.toml=$plugin_ver"
          if [ "$tag" != "$cargo_ver" ] || [ "$tag" != "$plugin_ver" ]; then
            echo "::error::tag v$tag disagrees with Cargo.toml ($cargo_ver) / plugin.toml ($plugin_ver)"
            exit 1
          fi

      # `--locked` builds the release from the committed Cargo.lock. Without it
      # each runner re-resolves the dependency graph, so the three platform
      # binaries can be built against different transitive versions than each
      # other and than whatever was tested — and this cdylib shares acadrust
      # types with the host across the plugin boundary.
      - name: Build
        shell: bash
        run: |
          rustc --version
          cargo build --release --locked

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          # The cdylib name varies by platform (lib*.so / *.dll / lib*.dylib);
          # the host loader accepts any name with the right extension.
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          python .github/scripts/build_metadata.py --output dist/plugin.toml --build-info "dist/${{ matrix.asset }}.build.json"
      - name: Test the published Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hostBuild = Get-Content host-build.json | ConvertFrom-Json
          gh release download $hostBuild.tag --repo HakanSeven12/OpenCADStudio --pattern $hostBuild.windows_asset --dir .compat-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/windows_smoke.py --host ".compat-host/$($hostBuild.windows_asset)"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-compatibility-logs
          path: .compat-host/logs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Verify platform manifests agree before publishing
        shell: bash
        run: |
          set -euo pipefail
          cmp artifacts/release-ubuntu-latest/plugin.toml artifacts/release-windows-latest/plugin.toml
          cmp artifacts/release-ubuntu-latest/plugin.toml artifacts/release-macos-latest/plugin.toml
          mkdir dist
          cp artifacts/release-*/opencad.landsurvey-* dist/
          cp artifacts/release-ubuntu-latest/plugin.toml dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
