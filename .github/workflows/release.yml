name: release

# Build the plugin cdylib for each desktop platform and attach the binaries
# (plus plugin.toml) to a GitHub Release. Open CAD Studio's Plugin Manager reads
# the release assets, picks the one matching the user's OS/arch, and installs it.
#
# Two entry points:
#
#   push (v* tag)  — a human tagged by hand.
#   workflow_call  — repin.yml cutting an automated release. This exists because
#                    GitHub does not start workflows from events created with
#                    the default GITHUB_TOKEN: a tag the bot pushes would never
#                    fire the `push` trigger above, so the bot calls this
#                    workflow directly instead of relying on the tag event.
#                    The caller must pass `secrets: inherit` for macOS signing.
#   workflow_dispatch — rebuild an existing tag by hand. With `dry_run` it
#                    builds, signs and notarizes but publishes nothing, which is
#                    how to exercise the signing path without cutting a release.
#
# macOS: the dylib is signed with the Developer ID and notarized. A Developer
# ID-signed Open CAD Studio runs with the hardened runtime, whose library
# validation loads only plugins signed with the same Team ID. An ad-hoc dylib
# is refused there ("mapping process and mapped file (non-platform) have
# different Team IDs"); ad-hoc hosts load either. Required secrets, the same
# ones KevinGriffin-new/OpenCADStudio signs with:
#   MACOS_CERT_P12        base64 of the "Developer ID Application" cert+key .p12
#   MACOS_CERT_PASSWORD   passphrase of that .p12
#   APPLE_ID              Apple ID email for notarization
#   APPLE_APP_PASSWORD    app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID         10-char team id the signature must carry
# A missing secret fails the release rather than shipping an unsigned dylib.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.4.6). Must already exist."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.4.22)"
        required: true
        type: string
      dry_run:
        description: "Build, sign and notarize, but publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.landsurvey-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.landsurvey-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.landsurvey-macos-aarch64.dylib
    runs-on: ${{ matrix.os }}
    env:
      # `inputs` is unset on the push path, so this resolves to the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the tagged commit, not whatever the default branch points at
          # by the time a called run starts.
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the verified host compiler
        shell: bash
        run: |
          # `rustup show` only reports since rustup 1.28; it no longer installs the
          # toolchain named in rust-toolchain.toml. Install it explicitly so the
          # step does what its name says, whatever rustup version the runner has.
          rustup toolchain install "$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" --profile minimal
      - name: Verify host pin and compiler
        run: python .github/scripts/build_metadata.py

      # A release whose tag disagrees with the manifests ships a plugin that
      # reports the wrong version to the Plugin Manager. Catch it before the
      # assets are built.
      - name: Check tag matches the declared plugin version
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin_ver=$(grep -m1 '^version = ' plugin.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$cargo_ver  plugin.toml=$plugin_ver"
          if [ "$tag" != "$cargo_ver" ] || [ "$tag" != "$plugin_ver" ]; then
            echo "::error::tag v$tag disagrees with Cargo.toml ($cargo_ver) / plugin.toml ($plugin_ver)"
            exit 1
          fi

      # `--locked` builds the release from the committed Cargo.lock. Without it
      # each runner re-resolves the dependency graph, so the three platform
      # binaries can be built against different transitive versions than each
      # other and than whatever was tested — and this cdylib shares acadrust
      # types with the host across the plugin boundary.
      - name: Build
        shell: bash
        run: |
          rustc --version
          cargo build --release --locked

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          # The cdylib name varies by platform (lib*.so / *.dll / lib*.dylib);
          # the host loader accepts any name with the right extension.
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          python .github/scripts/build_metadata.py --output dist/plugin.toml --build-info "dist/${{ matrix.asset }}.build.json"

      - name: Import the Developer ID certificate
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # An empty secret decodes to an empty file and `security import`
          # then fails with an opaque "parameters were not valid".
          [ -n "$CERT_P12" ] || { echo "::error::MACOS_CERT_P12 is not set; refusing to publish an unsigned macOS plugin"; exit 1; }
          KC=$RUNNER_TEMP/sign.keychain-db
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PW" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          IDENTITY=$(security find-identity -v -p codesigning "$KC" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Sign the dylib
        if: runner.os == 'macOS'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          LIB="dist/${{ matrix.asset }}"
          codesign --force --timestamp --options runtime -s "$IDENTITY" "$LIB"
          codesign --verify --strict --verbose=2 "$LIB"
          # Library validation compares Team IDs, so check the one that matters.
          got=$(codesign -dv "$LIB" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          echo "signed as: $IDENTITY (team $got)"
          [ -n "$TEAM_ID" ] && [ "$got" = "$TEAM_ID" ] || { echo "::error::dylib Team ID '$got' is not APPLE_TEAM_ID"; exit 1; }

      - name: Notarize the dylib
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for v in APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is not set"; exit 1; }
          done
          # A bare dylib can't be stapled; Gatekeeper looks the ticket up
          # online. Submitting it still clears quarantined downloads.
          ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --norsrc --noextattr "dist/${{ matrix.asset }}" "$ZIP"
          xcrun notarytool submit "$ZIP" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          # Never let a malformed reply skip the error below: print "- -" then.
          read -r ID STATUS < <(python3 -c '
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              d = {}
          print(d.get("id") or "-", d.get("status") or "-")' "$RUNNER_TEMP/notary.json")
          [ "$ID" = - ] && ID=
          if [ "$STATUS" != "Accepted" ]; then
            # The log names the exact per-file cause of a rejection.
            if [ -n "$ID" ]; then
              xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" || true
              echo "::error::notarization $STATUS; Apple's log above names the cause"
            else
              # No submission id: Apple refused the request itself. A 403 here
              # means the developer agreement needs re-accepting.
              echo "::error::notarization submission failed; see the reply above"
            fi
            exit 1
          fi

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: '[ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true'
      - name: Test the published Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hostBuild = Get-Content host-build.json | ConvertFrom-Json
          gh release download $hostBuild.tag --repo HakanSeven12/OpenCADStudio --pattern $hostBuild.windows_asset --dir .compat-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .github/scripts/windows_smoke.py --host ".compat-host/$($hostBuild.windows_asset)"
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-compatibility-logs
          path: .compat-host/logs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/

  publish:
    needs: build
    # `inputs.dry_run` is null on push and workflow_call, so only a dispatched
    # dry run skips publishing.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Verify platform manifests agree before publishing
        shell: bash
        run: |
          set -euo pipefail
          cmp artifacts/release-ubuntu-latest/plugin.toml artifacts/release-windows-latest/plugin.toml
          cmp artifacts/release-ubuntu-latest/plugin.toml artifacts/release-macos-latest/plugin.toml
          mkdir dist
          cp artifacts/release-*/opencad.landsurvey-* dist/
          cp artifacts/release-ubuntu-latest/plugin.toml dist/
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
