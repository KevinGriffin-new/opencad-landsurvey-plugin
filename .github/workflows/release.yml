name: release

# Build the plugin cdylib for each desktop platform and attach the binaries
# (plus plugin.toml) to a GitHub Release. Open CAD Studio's Plugin Manager reads
# the release assets, picks the one matching the user's OS/arch, and installs it.
#
# Two entry points:
#
#   push (v* tag)  — a human tagged by hand.
#   workflow_call  — repin.yml cutting an automated release. This exists because
#                    GitHub does not start workflows from events created with
#                    the default GITHUB_TOKEN: a tag the bot pushes would never
#                    fire the `push` trigger above, so the bot calls this
#                    workflow directly instead of relying on the tag event.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.4.6). Must already exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.landsurvey-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.landsurvey-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.landsurvey-macos-aarch64.dylib
    runs-on: ${{ matrix.os }}
    env:
      # `inputs` is unset on the push path, so this resolves to the pushed tag.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the tagged commit, not whatever the default branch points at
          # by the time a called run starts.
          ref: ${{ inputs.tag || github.ref_name }}
      # Floating `stable` on purpose: ABI compatibility with the host wants the
      # same toolchain, and OpenCADStudio's own release workflow builds on
      # `stable` too. Pinning a fixed rustc here would drift away from the host
      # over time rather than towards it. The version is echoed in the build
      # step so a failed load can be traced back to the exact compiler.
      - uses: dtolnay/rust-toolchain@stable

      # A release whose tag disagrees with the manifests ships a plugin that
      # reports the wrong version to the Plugin Manager. Catch it before the
      # assets are built.
      - name: Check tag matches the declared plugin version
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cargo_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          plugin_ver=$(grep -m1 '^version = ' plugin.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$cargo_ver  plugin.toml=$plugin_ver"
          if [ "$tag" != "$cargo_ver" ] || [ "$tag" != "$plugin_ver" ]; then
            echo "::error::tag v$tag disagrees with Cargo.toml ($cargo_ver) / plugin.toml ($plugin_ver)"
            exit 1
          fi

      # `--locked` builds the release from the committed Cargo.lock. Without it
      # each runner re-resolves the dependency graph, so the three platform
      # binaries can be built against different transitive versions than each
      # other and than whatever was tested — and this cdylib shares acadrust
      # types with the host across the plugin boundary.
      - name: Build
        shell: bash
        run: |
          rustc --version
          cargo build --release --locked

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          # The cdylib name varies by platform (lib*.so / *.dll / lib*.dylib);
          # the host loader accepts any name with the right extension.
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          cp plugin.toml dist/plugin.toml
      - uses: softprops/action-gh-release@v3
        with:
          # Explicit: on the workflow_call path there is no tag ref to infer.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml
