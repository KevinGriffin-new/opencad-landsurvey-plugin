name: repin

# Watch upstream Open CAD Studio releases and open a re-pin PR when a new
# release tag appears (ABI approach B: the plugin must be built against the
# same ocs_plugin_api commit and acadrust rev as the shipped host).
#
# Upstream releases land overnight in this timezone, so a purely mechanical
# re-pin ships itself: when every gate below is green the bot merges its own PR,
# tags, and calls release.yml. A human is escalated to ONLY when the mechanical
# path is not enough — that is what the gates are for:
#
#   - the host no longer accepts our api_version   (source migration needed)
#   - the acadrust semver requirement moved         (0.4 -> 0.5 is a decision)
#   - the plugin no longer compiles                 (contract/trait change)
#   - the test suite fails
#   - the end-to-end check fails                    (built host won't load us)
#   - the diff is not purely mechanical             (someone added source)
#
# Any of those stops the release, leaves the PR open, and opens a GitHub issue.
# Nine consecutive nightly failures once went unnoticed as red runs alone, so
# escalation is a durable artifact, not a status colour.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to re-pin to (default: latest release)"
        required: false
      dry_run:
        description: "Run every gate but stop before merge/tag/release"
        type: boolean
        default: false

concurrency:
  group: repin
  cancel-in-progress: false

env:
  UPSTREAM: HakanSeven12/OpenCADStudio

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      repin: ${{ steps.check.outputs.repin }}
      tag: ${{ steps.check.outputs.tag }}
      host_sha: ${{ steps.check.outputs.host_sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare latest upstream release against the current pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          # Deref annotated tags to the commit sha.
          SHA=$(gh api "repos/$UPSTREAM/commits/$TAG" --jq .sha)
          CURRENT=$(grep -oP 'OpenCADStudio", rev = "\K[0-9a-f]{40}' Cargo.toml)
          echo "upstream $TAG = $SHA ; pinned = $CURRENT"
          if [ "$SHA" = "$CURRENT" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Pin is current — nothing to do."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SHA" = "$CURRENT" ]; then
            # dry_run against the tag we already ship: the rewrite is a no-op but
            # build / test / end-to-end still exercise the whole gate. This is how
            # the automation gets validated without waiting for an upstream release.
            echo "::notice::dry run against the current pin — gates will run, nothing will ship."
          fi
          if [ "$DRY_RUN" != "true" ] \
             && git ls-remote --exit-code origin "refs/heads/repin/$TAG" >/dev/null 2>&1; then
            echo "Branch repin/$TAG already exists — PR pending or handled."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "repin=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "host_sha=$SHA" >> "$GITHUB_OUTPUT"

  repin:
    needs: detect
    if: needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.ship.outputs.release_tag }}
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      HOST_SHA: ${{ needs.detect.outputs.host_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: repin

      - name: Derive new pins from the upstream tag
        id: pins
        run: |
          # The acadrust pin comes from the host release's own Cargo.lock. Take
          # the whole `source =` line, not just the rev: upstream has moved the
          # crate between repositories once already (HakanSeven12/acadrust ->
          # OpenAEC-Foundation/acadifc, which then 404'd the old URL), and a
          # rev-only rewrite pins a commit that does not exist at the old URL.
          gh api "repos/$UPSTREAM/contents/Cargo.lock?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-Cargo.lock
          eval "$(python3 - <<'EOF'
          import re

          lines = open("/tmp/host-Cargo.lock").read().splitlines()
          src = None
          for i, l in enumerate(lines):
              if l.strip() == 'name = "acadrust"':
                  for m in lines[i : i + 5]:
                      if m.startswith("source"):
                          src = m.split("=", 1)[1].strip().strip('"')
                          break
                  break
          if not src:
              raise SystemExit("acadrust source not found in host Cargo.lock")
          # git+https://host/owner/repo?branch=main#<40-hex>
          m = re.fullmatch(r"git\+(?P<url>[^?#]+)(\?[^#]*)?#(?P<rev>[0-9a-f]{40})", src)
          if not m:
              raise SystemExit(f"unparseable acadrust source: {src}")
          print(f'ACADRUST_URL={m.group("url")}')
          print(f'ACADRUST_REV={m.group("rev")}')
          EOF
          )"

          # Same for the pin we currently carry — parsed generically so a URL
          # change is detected rather than silently preserved.
          eval "$(python3 - <<'EOF'
          import re

          cargo = open("Cargo.toml").read()
          m = re.search(
              r'^acadrust = \{ git = "(?P<url>[^"]+)", rev = "(?P<rev>[0-9a-f]{40})" \}',
              cargo, re.M,
          )
          if not m:
              raise SystemExit("could not parse the current acadrust patch in Cargo.toml")
          print(f'OLD_ACADRUST_URL={m.group("url")}')
          print(f'OLD_ACADRUST_REV={m.group("rev")}')
          EOF
          )"

          {
            echo "acadrust_url=$ACADRUST_URL"
            echo "acadrust_rev=$ACADRUST_REV"
            echo "old_acadrust_url=$OLD_ACADRUST_URL"
            echo "old_acadrust_rev=$OLD_ACADRUST_REV"
          } >> "$GITHUB_OUTPUT"

          echo "acadrust: $OLD_ACADRUST_URL@${OLD_ACADRUST_REV:0:7}"
          echo "       -> $ACADRUST_URL@${ACADRUST_REV:0:7}"
          if [ "$ACADRUST_URL" != "$OLD_ACADRUST_URL" ]; then
            echo "::notice::acadrust moved repositories: $OLD_ACADRUST_URL -> $ACADRUST_URL"
          fi

      # A repo move is mechanical; a semver-requirement move is not. `[patch]`
      # only redirects where a version comes from — it cannot satisfy a
      # requirement the manifest does not already allow. If the host moves to
      # acadrust 0.5 while we require "0.4", cargo rejects the patch outright,
      # and choosing the new requirement (plus whatever API churn rides along)
      # is a source decision, not a pin bump.
      - name: Gate on the acadrust version requirement
        id: acadver
        run: |
          gh api "repos/$UPSTREAM/contents/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-Cargo.toml
          HOST_REQ=$(grep -oP '^acadrust = "\K[^"]+' /tmp/host-Cargo.toml || true)
          OURS_REQ=$(grep -oP '^acadrust = "\K[^"]+' Cargo.toml || true)
          echo "host requires acadrust \"$HOST_REQ\"; we require \"$OURS_REQ\""
          if [ -z "$HOST_REQ" ] || [ -z "$OURS_REQ" ]; then
            echo "::error::could not read the acadrust requirement from one of the manifests"
            exit 1
          fi
          if [ "$HOST_REQ" != "$OURS_REQ" ]; then
            echo "::error::acadrust requirement moved \"$OURS_REQ\" -> \"$HOST_REQ\" in host $TAG. A [patch] cannot cross a semver bump — this needs a source change, not a re-pin."
            exit 1
          fi

      - name: Gate on the plugin API version handshake
        id: apiver
        run: |
          gh api "repos/$UPSTREAM/contents/crates/ocs_plugin_api/src/manifest.rs?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/manifest.rs
          MAX=$(grep -oP 'API_VERSION: u32 = \K\d+' /tmp/manifest.rs)
          MIN=$(grep -oP 'API_VERSION_MIN_SUPPORTED: u32 = \K\d+' /tmp/manifest.rs)
          OURS=$(grep -oP 'api_version = \K\d+' plugin.toml)
          echo "host accepts [$MIN, $MAX]; plugin declares $OURS"
          if [ "$OURS" -lt "$MIN" ] || [ "$OURS" -gt "$MAX" ]; then
            echo "::error::Host $TAG no longer accepts api_version=$OURS — a source migration is needed, not a re-pin."
            exit 1
          fi
          # Acceptance is not enough. We link ocs_plugin_api and register with
          # `ApiVersion::CURRENT`, so the cdylib reports the host's API_VERSION
          # from `ocs_plugin_api_version()` no matter what plugin.toml claims.
          # Declaring the old number still *loads* (the host accepts down to
          # API_VERSION_MIN_SUPPORTED), which is exactly why api_version sat at
          # 2 across three host releases without anyone noticing. Track MAX so
          # the manifest describes the binary we actually ship.
          echo "api_version=$MAX" >> "$GITHUB_OUTPUT"
          if [ "$OURS" != "$MAX" ]; then
            echo "::notice::api_version $OURS -> $MAX (host $TAG exports API_VERSION=$MAX)"
          fi

      - name: Rewrite pins and bump the patch version
        id: bump
        env:
          ACADRUST_URL: ${{ steps.pins.outputs.acadrust_url }}
          ACADRUST_REV: ${{ steps.pins.outputs.acadrust_rev }}
          API_VERSION: ${{ steps.apiver.outputs.api_version }}
        run: |
          NEWVER=$(python3 - <<'EOF'
          import os, re

          tag, host_sha = os.environ["TAG"], os.environ["HOST_SHA"]
          acad_url, acad_rev = os.environ["ACADRUST_URL"], os.environ["ACADRUST_REV"]
          api_version = os.environ["API_VERSION"]

          cargo = open("Cargo.toml").read()
          cargo, n = re.subn(
              r'(OpenCADStudio", rev = ")[0-9a-f]{40}', r"\g<1>" + host_sha, cargo
          )
          if n != 1:
              raise SystemExit(f"expected 1 ocs_plugin_api rev to rewrite, rewrote {n}")

          # Replace the whole patch entry so a repository move is carried too.
          cargo, n = re.subn(
              r'^acadrust = \{ git = "[^"]+", rev = "[0-9a-f]{40}" \}',
              f'acadrust = {{ git = "{acad_url}", rev = "{acad_rev}" }}',
              cargo, flags=re.M,
          )
          if n != 1:
              raise SystemExit(f"expected 1 acadrust patch to rewrite, rewrote {n}")

          # Keep the pin comments honest: they name the release the revs came from.
          cargo = re.sub(r"Pinned to the v[\d.]+ RELEASE TAG commit", f"Pinned to the {tag} RELEASE TAG commit", cargo)
          cargo = re.sub(r"Match the v[\d.]+ release's acadrust", f"Match the {tag} release's acadrust", cargo)

          ver = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', cargo, re.M).groups()
          new = f"{ver[0]}.{ver[1]}.{int(ver[2]) + 1}"
          cargo = re.sub(r'^version = "[\d.]+"', f'version = "{new}"', cargo, count=1, flags=re.M)
          open("Cargo.toml", "w").write(cargo)

          plug = open("plugin.toml").read()
          plug = re.sub(r'^version = "[\d.]+"', f'version = "{new}"', plug, count=1, flags=re.M)
          plug = re.sub(r"^api_version = \d+", f"api_version = {api_version}", plug, count=1, flags=re.M)
          open("plugin.toml", "w").write(plug)
          print(new)
          EOF
          )
          echo "newver=$NEWVER" >> "$GITHUB_OUTPUT"
          git diff

      # An automated release may only carry a mechanical re-pin. If anything
      # outside the three manifests changed, the diff is no longer something
      # this workflow's gates can vouch for, so it stops and asks for a human.
      - name: Gate on the diff being purely mechanical
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          UNEXPECTED=$(git diff --name-only \
            | grep -vE '^(Cargo\.toml|plugin\.toml|Cargo\.lock)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::re-pin touched files beyond the manifests: $UNEXPECTED"
            exit 1
          fi

      - name: Build and test the plugin against the new pins
        run: |
          # Refresh the committed lockfile for the new pins, then build from it.
          # release.yml builds `--locked`, so a PR that bumps Cargo.toml without
          # the matching Cargo.lock would pass here and fail at release time.
          cargo generate-lockfile
          cargo build --release --locked
          cargo test --workspace --locked

      - name: Build the host at the release tag
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
          git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM" host
          cargo build --manifest-path host/Cargo.toml

      - name: End-to-end — host loads the plugin and dispatches LS_ commands
        run: |
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/plugins/opencad.landsurvey"
          cp plugin.toml target/release/libopencad_landsurvey_plugin.so \
            "$STAGE/plugins/opencad.landsurvey/"
          printf '1,5000.00,5000.00,100.00,IPF\n2,5100.00,5050.00,101.25,IPF\n3,5200.00,4980.00,99.80,MON\n' \
            > "$STAGE/points.csv"
          {
            echo '{"op":"new"}'
            echo "{\"op\":\"run\",\"cmd\":\"LS_PNEZD $STAGE/points.csv\"}"
            echo '{"op":"entities"}'
            echo '{"op":"layers"}'
            echo '{"op":"run","cmd":"LS_INVERSE 5000 5000 5100 5050 draw"}'
          } | OCS_PLUGINS_DIR="$STAGE/plugins" host/target/debug/OpenCADStudio --serve \
            | tee /tmp/serve.out
          python3 - <<'EOF'
          import json

          replies = [json.loads(l) for l in open("/tmp/serve.out") if l.startswith("{")]
          # ready banner, new, LS_PNEZD, entities, layers, LS_INVERSE
          pnezd = next(r for r in replies if r.get("cmd", "").startswith("LS_PNEZD"))
          assert pnezd["added"] == 6, f"LS_PNEZD drew {pnezd['added']} entities, expected 6 (3 points + 3 labels)"
          ents = next(r for r in replies if "by_type" in r and r["total"] > 0)
          assert ents["by_type"].get("Point") == 3 and ents["by_type"].get("Text") == 3, ents
          layers = next(r for r in replies if "layers" in r)
          names = {l["name"] for l in layers["layers"]}
          assert {"LS-PT-IPF", "LS-PT-MON"} <= names, f"missing LS-PT-* layers: {names}"
          inverse = next(r for r in replies if r.get("cmd", "").startswith("LS_INVERSE"))
          assert inverse["added"] == 3, f"LS_INVERSE draw added {inverse['added']}, expected 3 (line + 2 labels)"
          print("end-to-end OK: plugin loaded, LS_PNEZD and LS_INVERSE dispatched")
          EOF

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "::notice::dry run: every gate passed. Nothing merged, tagged or released."
          echo "### Dry run — all gates green" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was merged, tagged or published." >> "$GITHUB_STEP_SUMMARY"

      - name: Open the re-pin PR
        if: ${{ !inputs.dry_run }}
        id: pr
        env:
          ACADRUST_URL: ${{ steps.pins.outputs.acadrust_url }}
          ACADRUST_REV: ${{ steps.pins.outputs.acadrust_rev }}
          OLD_ACADRUST_URL: ${{ steps.pins.outputs.old_acadrust_url }}
          OLD_ACADRUST_REV: ${{ steps.pins.outputs.old_acadrust_rev }}
          NEWVER: ${{ steps.bump.outputs.newver }}
          API_VERSION: ${{ steps.apiver.outputs.api_version }}
        run: |
          ACAD_SHORT=${ACADRUST_REV:0:7}

          # What moved in acadrust between the pins, for the PR body. Only
          # meaningful when both revs live in the same repository — across a
          # move there is no common history to compare, and the old repo may be
          # gone entirely (HakanSeven12/acadrust now 404s).
          if [ "$ACADRUST_URL" = "$OLD_ACADRUST_URL" ]; then
            ACAD_SLUG=$(echo "$ACADRUST_URL" | sed -E 's#^https://github\.com/##; s#\.git$##')
            ACAD_LOG=$(gh api "repos/$ACAD_SLUG/compare/$OLD_ACADRUST_REV...$ACADRUST_REV" \
              --jq '[.commits[].commit.message | split("\n")[0] | "- " + .] | join("\n")' \
              || echo "- (compare unavailable)")
          else
            ACAD_LOG="- acadrust MOVED repositories: \`$OLD_ACADRUST_URL\` -> \`$ACADRUST_URL\`
          - No commit range spans the move; review the new source directly."
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "repin/$TAG"
          # -f because Cargo.lock was gitignored historically; the release build
          # runs --locked, so the lockfile has to travel with the pin bump.
          git add Cargo.toml plugin.toml
          git add -f Cargo.lock
          git commit -m "release: v$NEWVER — re-pin to host $TAG (acadrust $ACAD_SHORT)" \
            -m "Mechanical pin bump per the rebuild rule, opened by the repin
          workflow. Tests and the headless host end-to-end check ran green in
          the workflow run that opened this PR."
          git push origin "repin/$TAG"

          gh pr create \
            --title "release: v$NEWVER — re-pin to host $TAG (acadrust $ACAD_SHORT)" \
            --body "Automated re-pin: upstream released [\`$TAG\`](https://github.com/$UPSTREAM/releases/tag/$TAG).

          | pin | old | new |
          |---|---|---|
          | \`ocs_plugin_api\` | (previous) | \`$HOST_SHA\` ($TAG) |
          | \`acadrust\` repo | \`$OLD_ACADRUST_URL\` | \`$ACADRUST_URL\` |
          | \`acadrust\` rev | \`$OLD_ACADRUST_REV\` | \`$ACADRUST_REV\` |
          | \`api_version\` | (previous) | \`$API_VERSION\` |

          **Checks run in this workflow:** api-version gate, \`cargo test --workspace --locked\`,
          and the headless end-to-end check (host built at \`$TAG\` loads the plugin,
          \`LS_PNEZD\` imports 3 points + labels onto \`LS-PT-*\` layers, \`LS_INVERSE draw\`
          draws the labeled line).

          **acadrust changes between the pins:**
          $ACAD_LOG

          Every gate passed, so this PR is merged and released automatically by
          the run that opened it. It stays here as the audit trail and the thing
          to revert if the release turns out bad."

      # Every gate is green and the diff is mechanical, so ship it. A human is
      # not in this path by design: upstream releases land overnight in this
      # timezone, and waiting for a morning merge is the whole problem. The PR
      # above remains the audit trail and the revert point.
      - name: Merge and tag
        if: ${{ !inputs.dry_run }}
        id: ship
        env:
          NEWVER: ${{ steps.bump.outputs.newver }}
        run: |
          set -euo pipefail
          gh pr merge "repin/$TAG" --merge --delete-branch

          # Tag the merge commit on main, not the branch head.
          git fetch origin main
          MERGE_SHA=$(git rev-parse origin/main)
          git tag "v$NEWVER" "$MERGE_SHA"
          git push origin "v$NEWVER"
          echo "tagged v$NEWVER at $MERGE_SHA"
          echo "release_tag=v$NEWVER" >> "$GITHUB_OUTPUT"

  # Build and publish the release. Invoked directly rather than by the tag push
  # above, because GitHub does not start workflows from events created with the
  # default GITHUB_TOKEN — the bot's `git push origin v*` fires nothing.
  release:
    needs: repin
    if: needs.repin.outputs.release_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.repin.outputs.release_tag }}

  # Escalation. A gate stopped the mechanical path, so a human has to decide
  # something. A red run alone is not enough — nine consecutive nightly failures
  # once went unnoticed — so leave a durable, self-explaining artifact.
  escalate:
    needs: [detect, repin]
    if: failure() && needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the escalation issue
        run: |
          set -euo pipefail
          TITLE="repin blocked: host $TAG needs a human"

          BODY=$(cat <<EOF
          The automated re-pin to upstream \`$TAG\` did not pass its gates, so
          nothing was merged, tagged or released.

          **Run:** $RUN_URL

          The bot ships a re-pin on its own only while the change stays
          mechanical. One of these stopped it:

          - the host no longer accepts our \`api_version\` (source migration)
          - the \`acadrust\` semver requirement moved (e.g. 0.4 -> 0.5)
          - the plugin no longer compiles against the new contract
          - \`cargo test --workspace --locked\` failed
          - the end-to-end check failed (host at \`$TAG\` would not load us)
          - the diff reached beyond \`Cargo.toml\` / \`plugin.toml\` / \`Cargo.lock\`

          Open the run log above; the failing step names which one and why.

          This issue is updated, not duplicated, on repeated failures for the
          same upstream tag. Close it once the re-pin lands.
          EOF
          )

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still blocked as of $RUN_URL"
            echo "commented on #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
