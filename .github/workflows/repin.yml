name: repin

# Watch upstream Open CAD Studio releases and open a re-pin PR when a new
# release tag appears (ABI approach B: the plugin must be built against the
# same ocs_plugin_api commit and acadrust rev as the shipped host).
#
# Upstream releases land overnight in this timezone, so a purely mechanical
# re-pin ships itself: when every gate below is green the bot merges its own PR,
# tags, and calls release.yml. A human is escalated to ONLY when the mechanical
# path is not enough — that is what the gates are for:
#
#   - the host no longer accepts our api_version   (source migration needed)
#   - the acadrust series moved (0.4 -> 0.5)       (API churn rides along)
#   - our acadrust source does not match the one   (two acadrusts in one graph)
#     ocs_plugin_api links, [patch] included
#   - the plugin no longer compiles                (contract/trait change)
#   - the test suite fails
#   - the end-to-end check fails                   (built host won't load us)
#   - the diff is not purely mechanical            (someone added source)
#
# Any of those stops the release, leaves the PR open, and opens a GitHub issue.
# Nine consecutive nightly failures once went unnoticed as red runs alone, so
# escalation is a durable artifact, not a status colour.
#
# The gate logic itself lives in .github/scripts/repin_gates.py, not in heredocs
# here, so that it can be unit-tested against the vendored corpus of real
# upstream manifests in .github/scripts/tests/fixtures/host/. Every previous
# break of these gates was an upstream respelling found by a red nightly run;
# ci.yml now runs the corpus on every PR instead, and canary.yml watches
# upstream main for shapes the parsers cannot read yet.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to re-pin to (default: latest release)"
        required: false
      dry_run:
        description: "Run every gate but stop before merge/tag/release"
        type: boolean
        default: false

concurrency:
  group: repin
  cancel-in-progress: false

env:
  UPSTREAM: HakanSeven12/OpenCADStudio
  GATES: .github/scripts/repin_gates.py

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      repin: ${{ steps.check.outputs.repin }}
      tag: ${{ steps.check.outputs.tag }}
      host_sha: ${{ steps.check.outputs.host_sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Compare latest upstream release against the current pin
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          fi
          # Deref annotated tags to the commit sha.
          SHA=$(gh api "repos/$UPSTREAM/commits/$TAG" --jq .sha)
          CURRENT=$(python3 "$GATES" current-pin | sed -n 's/^current_pin=//p')
          echo "upstream $TAG = $SHA ; pinned = $CURRENT"
          if [ "$SHA" = "$CURRENT" ] && [ "$DRY_RUN" != "true" ]; then
            echo "Pin is current — nothing to do."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SHA" = "$CURRENT" ]; then
            # dry_run against the tag we already ship: the rewrite is a no-op but
            # build / test / end-to-end still exercise the whole gate. This is how
            # the automation gets validated without waiting for an upstream release.
            echo "::notice::dry run against the current pin — gates will run, nothing will ship."
          fi
          if [ "$DRY_RUN" != "true" ] \
             && git ls-remote --exit-code origin "refs/heads/repin/$TAG" >/dev/null 2>&1; then
            echo "Branch repin/$TAG already exists — PR pending or handled."
            echo "repin=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "repin=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "host_sha=$SHA" >> "$GITHUB_OUTPUT"

  repin:
    needs: detect
    if: needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.ship.outputs.release_tag }}
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      HOST_SHA: ${{ needs.detect.outputs.host_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the verified host compiler
        shell: bash
        run: |
          # `rustup show` only reports since rustup 1.28; it no longer installs the
          # toolchain named in rust-toolchain.toml. Install it explicitly so the
          # step does what its name says, whatever rustup version the runner has.
          rustup toolchain install "$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: repin

      - name: Fetch the upstream manifests at the release tag
        run: |
          set -euo pipefail
          # The root Cargo.toml is fetched for its [patch] table, not its
          # [dependencies]: since v0.9.8 the host redirects acadrust there, and
          # the redirect is invisible in ocs_plugin_api's own manifest.
          gh api "repos/$UPSTREAM/contents/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-Cargo.toml
          gh api "repos/$UPSTREAM/contents/Cargo.lock?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-Cargo.lock
          gh api "repos/$UPSTREAM/contents/crates/ocs_plugin_api/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-api-Cargo.toml
          gh api "repos/$UPSTREAM/contents/crates/ocs_plugin_api/src/manifest.rs?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/manifest.rs

      - name: Read the pins we ship today
        id: old
        run: python3 "$GATES" current-pin

      # The new pin is copied from ocs_plugin_api's OWN manifest, not from the
      # lockfile's expanded sha: ocs_plugin_api is the crate we link, and cargo
      # keys a git source on the literal `?rev=` text, so matching its spelling
      # character for character is what puts one acadrust in the graph.
      #
      # The host root's [patch] for acadrust is read alongside it and mirrored,
      # because a patch applies only from the workspace root and we are our own
      # root. This step also asserts that those two facts together reproduce the
      # source the host's LOCKFILE records — if they do not, the gates below are
      # reasoning about an acadrust the host does not ship.
      - name: Plan the acadrust source the way the host resolves it
        id: pins
        run: |
          python3 "$GATES" host-plan \
            --plugin-api-manifest /tmp/host-api-Cargo.toml \
            --host-manifest /tmp/host-Cargo.toml \
            --host-lock /tmp/host-Cargo.lock

      - name: Note a repository move
        env:
          NEW: ${{ steps.pins.outputs.acadrust_slug }}
          OLD: ${{ steps.old.outputs.current_acadrust_slug }}
        run: |
          echo "acadrust: $OLD@${{ steps.old.outputs.current_acadrust_rev }}"
          echo "       -> $NEW@${{ steps.pins.outputs.acadrust_rev }}"
          if [ "$NEW" != "$OLD" ]; then
            echo "::notice::acadrust moved repositories: $OLD -> $NEW"
          fi

      # A repo move, a rev bump and a respelling are all mechanical. A series
      # move is not: cargo will not cross 0.4 -> 0.5 on its own, and the API
      # churn that rides along is a source decision.
      - name: Gate on the acadrust series
        id: acadver
        run: python3 "$GATES" gate-acadrust --host-lock /tmp/host-Cargo.lock --tag "$TAG"

      - name: Gate on the plugin API version handshake
        id: apiver
        run: python3 "$GATES" gate-api --manifest-rs /tmp/manifest.rs --tag "$TAG"

      - name: Rewrite pins and bump the patch version
        id: bump
        run: |
          python3 "$GATES" rewrite \
            --tag "$TAG" \
            --host-sha "$HOST_SHA" \
            --acadrust-url "${{ steps.pins.outputs.acadrust_url }}" \
            --acadrust-rev "${{ steps.pins.outputs.acadrust_rev }}" \
            --api-version "${{ steps.apiver.outputs.api_version }}" \
            --patch-key "${{ steps.pins.outputs.patch_key }}" \
            --patch-url "${{ steps.pins.outputs.patch_url }}" \
            --patch-rev "${{ steps.pins.outputs.patch_rev }}"
          git diff

      - name: Record the compiler used by the published host
        run: |
          python3 .github/scripts/record_host_build.py --tag "$TAG"
          # The record may have changed rust-toolchain.toml: install the
          # compiler it now names before anything below invokes cargo.
          rustup toolchain install "$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)" --profile minimal
          rustc --version

      # Preventive half of the ABI contract: our acadrust must be declared
      # byte-for-byte the way ocs_plugin_api declares it, and our [patch] must
      # mirror the host root's exactly (or be absent, when the host has none).
      - name: Gate on the acadrust source matching the host's
        run: |
          python3 "$GATES" gate-source \
            --plugin-api-manifest /tmp/host-api-Cargo.toml \
            --host-manifest /tmp/host-Cargo.toml

      # An automated release may only carry a mechanical re-pin. If anything
      # outside the three manifests changed, the diff is no longer something
      # this workflow's gates can vouch for, so it stops and asks for a human.
      - name: Gate on the diff being purely mechanical
        run: |
          CHANGED=$(git diff --name-only | sort | tr '\n' ' ')
          echo "changed: $CHANGED"
          UNEXPECTED=$(git diff --name-only \
            | grep -vE '^(Cargo\.toml|plugin\.toml|Cargo\.lock|host-build\.json|rust-toolchain\.toml)$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::re-pin touched files beyond the manifests: $UNEXPECTED"
            exit 1
          fi

      - name: Refresh the lockfile for the new pins
        run: cargo generate-lockfile

      # Empirical half of the ABI contract, and the gate that catches the class
      # of break v0.9.5 introduced: exactly one acadrust in the graph, resolved
      # to the same commit the host builds against.
      - name: Gate on one acadrust at the host's rev
        run: |
          python3 "$GATES" gate-abi --host-rev "${{ steps.acadver.outputs.host_rev }}"

      - name: Verify published host compiler before building
        run: python3 .github/scripts/build_metadata.py

      - name: Build and test the plugin against the new pins
        run: |
          # release.yml builds `--locked`, so a PR that bumps Cargo.toml without
          # the matching Cargo.lock would pass here and fail at release time.
          cargo build --release --locked
          cargo test --workspace --locked

      - name: Build the host at the release tag
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libfreetype6-dev
          git clone --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM" host
          cargo build --manifest-path host/Cargo.toml

      - name: End-to-end — host loads the plugin and dispatches LS_ commands
        run: |
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/plugins/opencad.landsurvey"
          python3 .github/scripts/build_metadata.py --output "$STAGE/plugins/opencad.landsurvey/plugin.toml"
          cp target/release/libopencad_landsurvey_plugin.so "$STAGE/plugins/opencad.landsurvey/"
          printf '1,5000.00,5000.00,100.00,IPF\n2,5100.00,5050.00,101.25,IPF\n3,5200.00,4980.00,99.80,MON\n' \
            > "$STAGE/points.csv"
          {
            echo '{"op":"new"}'
            echo "{\"op\":\"run\",\"cmd\":\"LS_PNEZD $STAGE/points.csv\"}"
            echo '{"op":"entities"}'
            echo '{"op":"layers"}'
            echo '{"op":"run","cmd":"LS_INVERSE 5000 5000 5100 5050 draw"}'
          } | OCS_PLUGINS_DIR="$STAGE/plugins" host/target/debug/OpenCADStudio --serve \
            | tee /tmp/serve.out
          python3 - <<'EOF'
          import json

          replies = [json.loads(l) for l in open("/tmp/serve.out") if l.startswith("{")]
          # ready banner, new, LS_PNEZD, entities, layers, LS_INVERSE
          pnezd = next(r for r in replies if r.get("cmd", "").startswith("LS_PNEZD"))
          assert pnezd["added"] == 6, f"LS_PNEZD drew {pnezd['added']} entities, expected 6 (3 points + 3 labels)"
          ents = next(r for r in replies if "by_type" in r and r["total"] > 0)
          assert ents["by_type"].get("Point") == 3 and ents["by_type"].get("Text") == 3, ents
          layers = next(r for r in replies if "layers" in r)
          names = {l["name"] for l in layers["layers"]}
          assert {"LS-PT-IPF", "LS-PT-MON"} <= names, f"missing LS-PT-* layers: {names}"
          inverse = next(r for r in replies if r.get("cmd", "").startswith("LS_INVERSE"))
          assert inverse["added"] == 3, f"LS_INVERSE draw added {inverse['added']}, expected 3 (line + 2 labels)"
          print("end-to-end OK: plugin loaded, LS_PNEZD and LS_INVERSE dispatched")
          EOF

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          echo "::notice::dry run: every gate passed. Nothing merged, tagged or released."
          echo "### Dry run — all gates green" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing was merged, tagged or published." >> "$GITHUB_STEP_SUMMARY"

      - name: Open the re-pin PR
        if: ${{ !inputs.dry_run }}
        id: pr
        env:
          ACADRUST_URL: ${{ steps.pins.outputs.acadrust_url }}
          ACADRUST_REV: ${{ steps.pins.outputs.acadrust_rev }}
          ACADRUST_SLUG: ${{ steps.pins.outputs.acadrust_slug }}
          OLD_ACADRUST_URL: ${{ steps.old.outputs.current_acadrust_url }}
          OLD_ACADRUST_REV: ${{ steps.old.outputs.current_acadrust_rev }}
          OLD_ACADRUST_SLUG: ${{ steps.old.outputs.current_acadrust_slug }}
          RESOLVED_REV: ${{ steps.acadver.outputs.host_rev }}
          PATCH_KEY: ${{ steps.pins.outputs.patch_key }}
          PATCH_URL: ${{ steps.pins.outputs.patch_url }}
          PATCH_REV: ${{ steps.pins.outputs.patch_rev }}
          NEWVER: ${{ steps.bump.outputs.newver }}
          API_VERSION: ${{ steps.apiver.outputs.api_version }}
        run: |
          # What moved in acadrust between the pins, for the PR body. Only
          # meaningful when both revs live in the same repository — across a
          # move there is no common history to compare, and the old repo may be
          # gone entirely (HakanSeven12/acadrust now 404s).
          if [ "$ACADRUST_SLUG" = "$OLD_ACADRUST_SLUG" ]; then
            ACAD_REPO=${ACADRUST_SLUG#github.com/}
            ACAD_LOG=$(gh api "repos/$ACAD_REPO/compare/$OLD_ACADRUST_REV...$ACADRUST_REV" \
              --jq '[.commits[].commit.message | split("\n")[0] | "- " + .] | join("\n")' \
              || echo "- (compare unavailable)")
          else
            ACAD_LOG="- acadrust MOVED repositories: \`$OLD_ACADRUST_SLUG\` -> \`$ACADRUST_SLUG\`
          - No commit range spans the move; review the new source directly."
          fi

          # The host root's acadrust redirect, mirrored into our manifest. A
          # [patch] applies only from the workspace root, so the host's does not
          # reach us and ours has to say the same thing.
          if [ -n "$PATCH_KEY" ]; then
            PATCH_ROW="| \`[patch]\` | mirrored from the host root | \`$PATCH_KEY\` -> \`$PATCH_URL\` rev \`$PATCH_REV\` |"
          else
            PATCH_ROW="| \`[patch]\` | — | none (the host declares no acadrust patch) |"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "repin/$TAG"
          # -f because Cargo.lock was gitignored historically; the release build
          # runs --locked, so the lockfile has to travel with the pin bump.
          git add Cargo.toml plugin.toml host-build.json rust-toolchain.toml
          git add -f Cargo.lock
          git commit -m "release: v$NEWVER — re-pin to host $TAG (acadrust $ACADRUST_REV)" \
            -m "Mechanical pin bump per the rebuild rule, opened by the repin
          workflow. Tests and the headless host end-to-end check ran green in
          the workflow run that opened this PR."
          git push origin "repin/$TAG"

          gh pr create \
            --title "release: v$NEWVER — re-pin to host $TAG (acadrust $ACADRUST_REV)" \
            --body "Automated re-pin: upstream released [\`$TAG\`](https://github.com/$UPSTREAM/releases/tag/$TAG).

          | pin | old | new |
          |---|---|---|
          | \`ocs_plugin_api\` | (previous) | \`$HOST_SHA\` ($TAG) |
          | \`acadrust\` repo | \`$OLD_ACADRUST_SLUG\` | \`$ACADRUST_SLUG\` |
          | \`acadrust\` rev | \`$OLD_ACADRUST_REV\` | \`$ACADRUST_REV\` (resolves to \`$RESOLVED_REV\`) |
          | \`api_version\` | (previous) | \`$API_VERSION\` |
          $PATCH_ROW

          The acadrust rev is copied verbatim from \`ocs_plugin_api\`'s manifest,
          abbreviation included: cargo keys a git source on that literal text, so
          expanding it would resolve a second acadrust into the graph.

          Since host v0.9.8 the declared rev is not the whole story — the host root
          can redirect that source with a \`[patch]\`, and a patch applies only from
          the workspace root. The row above says what the host redirects acadrust
          to, and our manifest carries a verbatim mirror of it.

          **Checks run in this workflow:** host-plan (the host's manifests explain
          its own lockfile), acadrust series gate, api-version gate,
          source-identity gate including the [patch] mirror,
          one-acadrust-at-the-host's-rev gate,
          \`cargo test --workspace --locked\`, and the headless end-to-end check
          (host built at \`$TAG\` loads the plugin, \`LS_PNEZD\` imports 3 points +
          labels onto \`LS-PT-*\` layers, \`LS_INVERSE draw\` draws the labeled line).

          **acadrust changes between the pins:**
          $ACAD_LOG

          Every gate passed, so this PR is merged and released automatically by
          the run that opened it. It stays here as the audit trail and the thing
          to revert if the release turns out bad."

      # Every gate is green and the diff is mechanical, so ship it. A human is
      # not in this path by design: upstream releases land overnight in this
      # timezone, and waiting for a morning merge is the whole problem. The PR
      # above remains the audit trail and the revert point.
      - name: Merge and tag
        if: ${{ !inputs.dry_run }}
        id: ship
        env:
          NEWVER: ${{ steps.bump.outputs.newver }}
        run: |
          set -euo pipefail
          gh pr merge "repin/$TAG" --merge --delete-branch

          # Tag the merge commit on main, not the branch head.
          git fetch origin main
          MERGE_SHA=$(git rev-parse origin/main)
          git tag "v$NEWVER" "$MERGE_SHA"
          git push origin "v$NEWVER"
          echo "tagged v$NEWVER at $MERGE_SHA"
          echo "release_tag=v$NEWVER" >> "$GITHUB_OUTPUT"

  # Build and publish the release. Invoked directly rather than by the tag push
  # above, because GitHub does not start workflows from events created with the
  # default GITHUB_TOKEN — the bot's `git push origin v*` fires nothing.
  release:
    needs: repin
    if: needs.repin.outputs.release_tag != ''
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.repin.outputs.release_tag }}

  # Escalation. A gate stopped the mechanical path, so a human has to decide
  # something. A red run alone is not enough — nine consecutive nightly failures
  # once went unnoticed — so leave a durable, self-explaining artifact.
  #
  # Rather than restate the list of things that might have gone wrong, this job
  # re-runs the read-only gates and reports what they actually say. Exit 2 means
  # a parser here cannot read upstream's shape (a bug in this repo); exit 1 means
  # the gates read it fine and a human has a decision; all-green means the break
  # is downstream, in the build, tests, or end-to-end check.
  escalate:
    needs: [detect, repin]
    if: failure() && needs.detect.outputs.repin == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Re-run the read-only gates to classify the failure
        id: why
        run: |
          set -euo pipefail
          gh api "repos/$UPSTREAM/contents/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-Cargo.toml
          gh api "repos/$UPSTREAM/contents/Cargo.lock?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-Cargo.lock
          gh api "repos/$UPSTREAM/contents/crates/ocs_plugin_api/Cargo.toml?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/host-api-Cargo.toml
          gh api "repos/$UPSTREAM/contents/crates/ocs_plugin_api/src/manifest.rs?ref=$TAG" \
            -H "Accept: application/vnd.github.raw" > /tmp/manifest.rs

          set +e
          {
            python3 "$GATES" host-plan \
              --plugin-api-manifest /tmp/host-api-Cargo.toml \
              --host-manifest /tmp/host-Cargo.toml \
              --host-lock /tmp/host-Cargo.lock
            echo "-> exit $?"
            python3 "$GATES" gate-acadrust --host-lock /tmp/host-Cargo.lock --tag "$TAG"
            a=$?; echo "-> exit $a"
            python3 "$GATES" gate-api --manifest-rs /tmp/manifest.rs --tag "$TAG"
            b=$?; echo "-> exit $b"
          } > /tmp/gates.txt 2>&1
          cat /tmp/gates.txt

          if grep -q "exit 2" /tmp/gates.txt; then
            echo "verdict=parser" >> "$GITHUB_OUTPUT"
          elif grep -q "exit 1" /tmp/gates.txt; then
            echo "verdict=decision" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=downstream" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the escalation issue
        env:
          VERDICT: ${{ steps.why.outputs.verdict }}
        run: |
          set -euo pipefail
          TITLE="repin blocked: host $TAG needs a human"

          case "$VERDICT" in
            parser)
              DIAGNOSIS="**The gates could not read upstream's manifests.** This is a
          bug in this repository, not a decision for you to make. Upstream has
          spelled something a way \`.github/scripts/repin_gates.py\` does not
          handle yet.

          The fix is always the same two steps:

          1. Vendor the offending upstream files into
             \`.github/scripts/tests/fixtures/host/$TAG/\`.
          2. Teach \`repin_gates.py\` the new shape, asserting the new fixture in
             \`.github/scripts/tests/test_repin_gates.py\`.

          Adding the fixture in the same PR as the fix is what keeps this from
          recurring — the corpus is the regression suite."
              ;;
            decision)
              DIAGNOSIS="**A gate read upstream fine and stopped on purpose.** Something
          changed that a pin bump cannot absorb — the acadrust series moved, or
          the host no longer accepts our \`api_version\`. The gate output below
          names which."
              ;;
            *)
              DIAGNOSIS="**Every read-only gate is green**, so the break is downstream of
          them: the build, \`cargo test --workspace --locked\`, the host build, or
          the end-to-end check. Open the run log and look at the failing step."
              ;;
          esac

          BODY=$(cat <<EOF
          The automated re-pin to upstream \`$TAG\` did not pass its gates, so
          nothing was merged, tagged or released.

          **Run:** $RUN_URL

          $DIAGNOSIS

          <details><summary>Gate output</summary>

          \`\`\`
          $(cat /tmp/gates.txt)
          \`\`\`

          </details>

          This issue is updated, not duplicated, on repeated failures for the
          same upstream tag. Close it once the re-pin lands.
          EOF
          )

          # --repo on every call: gh otherwise infers the repository from the git
          # remote, and a checkout is not guaranteed to give it one — which is how
          # a blocked re-pin once failed to notify anyone at all.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Still blocked as of $RUN_URL ($VERDICT)"
            echo "commented on #$EXISTING"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
